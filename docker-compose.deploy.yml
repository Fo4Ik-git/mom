# Production on server: ready image only (no build). Used by deploy.sh
services:
  calculator:
    image: calculator:latest
    container_name: calculator-1
    ports:
      - "${HOST_PORT:-3004}:${CONTAINER_PORT:-3000}"
    env_file:
      - .env.docker
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: file:./prisma/dev.db
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - /mnt/ssd/calculator/db/dev.db:/app/prisma/dev.db
      - /mnt/ssd/calculator/logs:/app/logs
    restart: unless-stopped
